packages:
  - 'packages/*'
  - 'docs'

# @baoku26/sbtc-sdk's native peers (react-native, expo-secure-store, expo-local-authentication)
# and web peer (@stacks/connect) are optional — do not auto-install them into the
# core dev install. The example apps install the peers they actually need.
autoInstallPeers: false

# pnpm 11 blocks dependency install scripts by default; each must be decided here
# (true = run the script, false = skip it without warning). This is the canonical
# location in pnpm 11 — values in .npmrc / `ignoredBuiltDependencies` are ignored.
#   esbuild              — needed by tsup to fetch its native binary (core build).
#   sharp, unrs-resolver — example-web (Next 16) deps; builds skipped to match
#                          create-next-app's own default. Not needed for local dev.
#   @reown/appkit, secp256k1 — transitive deps of @stacks/connect (WalletConnect
#                          path). Skipped: core mocks @stacks/connect in tests and
#                          uses @scure/* for crypto, so neither native build is
#                          needed for build/typecheck/test.
allowBuilds:
  '@reown/appkit': false
  esbuild: true
  secp256k1: false
  sharp: false
  unrs-resolver: false

# Pin the zod that Nextra (docs site) resolves to its declared baseline 4.1.12.
# Nextra 4.6.1 deps `zod ^4.1.12`, but zod 4.4.x made `z.custom()` reject a
# missing/undefined object key ("expected nonoptional"); Nextra's <Layout> validates
# its props WITHOUT `children` against a schema that still declares `children` (a
# `z.custom`-based `reactNode`), so it throws under 4.4.x. Scoped to the nextra
# subtrees only — the unrelated zod v3 consumers (@stacks / walletconnect) and any
# other zod 4 consumers are untouched. (pnpm 11 reads `overrides` here, not in
# package.json's `pnpm` field.)
overrides:
  nextra>zod: 4.1.12
  nextra-theme-docs>zod: 4.1.12
